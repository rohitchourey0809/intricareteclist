<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Inticare Lists</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <div class="overlay">

        <div class="modal">

            <!-- Header -->
            <div class="modal-header">
                <div>
                    <h2>Lookalikes</h2>
                    <p>Select a lookalike list for this campaign</p>
                </div>

                <button class="close-btn">&times;</button>
            </div>

            <!-- Body -->
            <div class="modal-body">

                <!-- Card 1 -->
                <div class="list-card active">
                    <div class="left">
                        <div class="drag-icon">≡</div>
                        <div>
                            <h3>Founder List</h3>
                            <span>(1000+ Users in the List)</span>
                        </div>
                    </div>
                    <div class="checkbox active-check">✓</div>
                </div>

                <!-- Card 2 -->
                <div class="list-card">
                    <div class="left">
                        <div class="drag-icon">☰</div>
                        <div>
                            <h3>Tech Profiles</h3>
                            <span>(1000+ Users in the List)</span>
                        </div>
                    </div>
                    <div class="checkbox"></div>
                </div>

                <!-- Add New -->
                <div class="add-new">+ Create new list</div>

            </div>

            <!-- Footer -->
            <div class="modal-footer">

                <button class="cancel-btn">
                    Cancel
                </button>

                <button class="select-btn">
                    Select List
                </button>

            </div>

        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
